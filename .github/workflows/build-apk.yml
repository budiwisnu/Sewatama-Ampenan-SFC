name: Build Sewatama Ampenan SFC APK (Auto-Repair & Latest SDK 35)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Auto-Repair & Generate Complete Android Project Structure (Anti-Error assembleDebug)
        shell: bash
        run: |
          set -e
          echo "Memeriksa dan menyusun struktur proyek Android (:app) secara otomatis..."

          # Jika user mengunggah file ZIP ke repo, ekstrak otomatis
          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Mengekstrak $z..."
              unzip -o "$z" || true
            fi
          done

          mkdir -p app/src/main/java/com/sewatama/ampenansfc/domain
          mkdir -p app/src/main/java/com/sewatama/ampenansfc/data
          mkdir -p app/src/main/java/com/sewatama/ampenansfc/ui
          mkdir -p app/src/main/java/com/sewatama/ampenansfc/util
          mkdir -p app/src/main/res/xml

          # 1. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SewatamaAmpenanSFC"
          include(":app")
          EOF

          # 2. Root build.gradle.kts (AGP 8.7.3 + Kotlin 2.0.21 + Compose Compiler Plugin + KSP)
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
              id("com.google.devtools.ksp") version "2.0.21-1.0.28" apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          # 4. app/build.gradle.kts (Memastikan task :app:assembleDebug selalu terdaftar)
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
          }

          android {
              namespace = "com.sewatama.ampenansfc"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.sewatama.ampenansfc"
                  minSdk = 30
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.10.01")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")

              val roomVersion = "2.6.1"
              implementation("androidx.room:room-runtime:$roomVersion")
              implementation("androidx.room:room-ktx:$roomVersion")
              ksp("androidx.room:room-compiler:$roomVersion")
          }
          EOF

          # 5. app/src/main/AndroidManifest.xml (Modern AGP 8.7+ tanpa atribut package deprecated)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Sewatama Ampenan SFC"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.action.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          # 6. app/src/main/res/xml/file_paths.xml
          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="exported_csv" path="exports/" />
          </paths>
          EOF

          # 7. SfcCalculationEngine.kt
          cat << 'EOF' > app/src/main/java/com/sewatama/ampenansfc/domain/SfcCalculationEngine.kt
          package com.sewatama.ampenansfc.domain

          import androidx.compose.ui.graphics.Color
          import java.math.BigDecimal
          import java.math.RoundingMode
          import java.util.Locale

          enum class SfcTier(
              val tierNumber: Int,
              val rangeDescription: String,
              val colorName: String,
              val textColor: Color,
              val indication: String
          ) {
              TIER_1(1, "SFC < 0.2750", "Merah", Color(0xFFEF4444), "Under-reading / Kebocoran Return BBM"),
              TIER_2(2, "0.2750 <= SFC < 0.2800", "Kuning", Color(0xFFF59E0B), "Batas Bawah / Perlu Pengawasan"),
              TIER_3(3, "0.2800 <= SFC <= 0.2840", "Hijau", Color(0xFF10B981), "Optimal / Normal"),
              TIER_4(4, "0.2840 < SFC < 0.2870", "Kuning", Color(0xFFF59E0B), "Batas Atas / Indikasi Inefisiensi"),
              TIER_5(5, "SFC >= 0.2870", "Merah", Color(0xFFEF4444), "Pemborosan / Over-consumption")
          }

          data class SfcCalculationResult(
              val totalKwh: Double,
              val totalBbmLiter: Double,
              val sfcValue: Double,
              val sfcFormatted: String,
              val tier: SfcTier
          )

          object SfcCalculationEngine {
              const val STANDBY_CAPACITY_LITERS = 14000.0
              private val BOUNDARY_TIER_1 = BigDecimal("0.2750")
              private val BOUNDARY_TIER_2 = BigDecimal("0.2800")
              private val BOUNDARY_TIER_3_MAX = BigDecimal("0.2840")
              private val BOUNDARY_TIER_4_MAX = BigDecimal("0.2870")

              fun calculateDailySfc(
                  kwhBlok1Today: Double,
                  kwhBlok1Yesterday: Double,
                  kwhBlok2Today: Double,
                  kwhBlok2Yesterday: Double,
                  isTankTopUpFull: Boolean,
                  tank1LevelActual: Double,
                  tank2LevelActual: Double,
                  flowMeterToday: Double,
                  flowMeterYesterday: Double
              ): SfcCalculationResult {
                  val totalKwh = (kwhBlok1Today - kwhBlok1Yesterday) + (kwhBlok2Today - kwhBlok2Yesterday)
                  val flowDiff = flowMeterToday - flowMeterYesterday
                  val totalBbmLiter = if (isTankTopUpFull) {
                      flowDiff
                  } else {
                      flowDiff + (STANDBY_CAPACITY_LITERS - tank1LevelActual) + (STANDBY_CAPACITY_LITERS - tank2LevelActual)
                  }
                  require(totalKwh > 0.0) { "Total Produksi Listrik (kWh) harus lebih besar dari 0." }
                  require(totalBbmLiter >= 0.0) { "Total Pemakaian BBM (Liter) tidak valid." }

                  val sfcBigDecimal = BigDecimal.valueOf(totalBbmLiter)
                      .divide(BigDecimal.valueOf(totalKwh), 4, RoundingMode.HALF_UP)
                  val sfcDouble = sfcBigDecimal.toDouble()
                  val sfcFormatted = String.format(Locale.US, "%.4f", sfcBigDecimal)
                  val tier = evaluateTier(sfcBigDecimal)
                  return SfcCalculationResult(totalKwh, totalBbmLiter, sfcDouble, sfcFormatted, tier)
              }

              fun evaluateTier(sfcValue: Double): SfcTier {
                  return evaluateTier(BigDecimal.valueOf(sfcValue).setScale(4, RoundingMode.HALF_UP))
              }

              fun evaluateTier(sfcBd: BigDecimal): SfcTier {
                  val n = sfcBd.setScale(4, RoundingMode.HALF_UP)
                  return when {
                      n < BOUNDARY_TIER_1 -> SfcTier.TIER_1
                      n >= BOUNDARY_TIER_1 && n < BOUNDARY_TIER_2 -> SfcTier.TIER_2
                      n >= BOUNDARY_TIER_2 && n <= BOUNDARY_TIER_3_MAX -> SfcTier.TIER_3
                      n > BOUNDARY_TIER_3_MAX && n < BOUNDARY_TIER_4_MAX -> SfcTier.TIER_4
                      else -> SfcTier.TIER_5
                  }
              }

              fun formatFourDecimals(value: Double): String {
                  val bd = BigDecimal.valueOf(value).setScale(4, RoundingMode.HALF_UP)
                  return String.format(Locale.US, "%.4f", bd)
              }
          }
          EOF

          # 8. SfcDatabase.kt
          cat << 'EOF' > app/src/main/java/com/sewatama/ampenansfc/data/SfcDatabase.kt
          package com.sewatama.ampenansfc.data

          import android.content.Context
          import androidx.room.Dao
          import androidx.room.Database
          import androidx.room.Entity
          import androidx.room.Insert
          import androidx.room.OnConflictStrategy
          import androidx.room.PrimaryKey
          import androidx.room.Query
          import androidx.room.Room
          import androidx.room.RoomDatabase
          import kotlinx.coroutines.flow.Flow

          @Entity(tableName = "daily_sfc_records")
          data class DailySfcEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val recordDate: String,
              val recordTime: String,
              val operatorName: String,
              val prevKwhBlok1: Double,
              val prevKwhBlok2: Double,
              val prevFlowMeterBbm: Double,
              val kwhBlok1Today: Double,
              val kwhBlok2Today: Double,
              val isTankTopUpFull: Boolean,
              val tank1LevelActual: Double,
              val tank2LevelActual: Double,
              val constraintNotes: String,
              val flowMeterBbmToday: Double,
              val totalKwh: Double,
              val totalBbmLiter: Double,
              val sfcValue: Double,
              val sfcFormatted: String
          )

          @Dao
          interface SfcRecordDao {
              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun insertRecord(record: DailySfcEntity)

              @Query("SELECT * FROM daily_sfc_records ORDER BY recordDate DESC, id DESC")
              fun getAllRecordsFlow(): Flow<List<DailySfcEntity>>
          }

          @Database(entities = [DailySfcEntity::class], version = 1, exportSchema = false)
          abstract class SfcAppDatabase : RoomDatabase() {
              abstract fun sfcRecordDao(): SfcRecordDao

              companion object {
                  @Volatile
                  private var INSTANCE: SfcAppDatabase? = null

                  fun getInstance(context: Context): SfcAppDatabase {
                      return INSTANCE ?: synchronized(this) {
                          val instance = Room.databaseBuilder(
                              context.applicationContext,
                              SfcAppDatabase::class.java,
                              "sewatama_ampenan_sfc.db"
                          ).build()
                          INSTANCE = instance
                          instance
                      }
                  }
              }
          }

          data class MasterDayZeroConfig(
              val initialFlowMeterBbm: Double,
              val initialKwhBlok1: Double,
              val initialKwhBlok2: Double,
              val isConfigured: Boolean
          )

          class MasterPreferencesRepository(context: Context) {
              private val prefs = context.getSharedPreferences("master_hari_0_prefs", Context.MODE_PRIVATE)

              fun saveMasterDayZero(flowMeter: Double, kwhBlok1: Double, kwhBlok2: Double) {
                  prefs.edit()
                      .putString("initial_flow_meter_bbm", flowMeter.toString())
                      .putString("initial_kwh_blok_1", kwhBlok1.toString())
                      .putString("initial_kwh_blok_2", kwhBlok2.toString())
                      .putBoolean("is_configured", true)
                      .apply()
              }

              fun getMasterDayZero(): MasterDayZeroConfig {
                  val flow = prefs.getString("initial_flow_meter_bbm", "1250000.0")?.toDoubleOrNull() ?: 1250000.0
                  val kwh1 = prefs.getString("initial_kwh_blok_1", "4520000.0")?.toDoubleOrNull() ?: 4520000.0
                  val kwh2 = prefs.getString("initial_kwh_blok_2", "3890000.0")?.toDoubleOrNull() ?: 3890000.0
                  val configured = prefs.getBoolean("is_configured", false)
                  return MasterDayZeroConfig(flow, kwh1, kwh2, configured)
              }
          }
          EOF

          # 9. SfcViewModel.kt
          cat << 'EOF' > app/src/main/java/com/sewatama/ampenansfc/ui/SfcViewModel.kt
          package com.sewatama.ampenansfc.ui

          import android.app.Application
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import com.sewatama.ampenansfc.data.DailySfcEntity
          import com.sewatama.ampenansfc.data.MasterDayZeroConfig
          import com.sewatama.ampenansfc.data.MasterPreferencesRepository
          import com.sewatama.ampenansfc.data.SfcAppDatabase
          import com.sewatama.ampenansfc.domain.SfcCalculationEngine
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.SharingStarted
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.flow.stateIn
          import kotlinx.coroutines.launch
          import java.math.BigDecimal
          import java.math.RoundingMode

          class SfcViewModel(application: Application) : AndroidViewModel(application) {
              private val dao = SfcAppDatabase.getInstance(application).sfcRecordDao()
              private val masterPrefs = MasterPreferencesRepository(application)

              private val _isAuthenticated = MutableStateFlow(false)
              val isAuthenticated: StateFlow<Boolean> = _isAuthenticated.asStateFlow()

              private val _masterConfig = MutableStateFlow(masterPrefs.getMasterDayZero())
              val masterConfig: StateFlow<MasterDayZeroConfig> = _masterConfig.asStateFlow()

              val allRecords: StateFlow<List<DailySfcEntity>> = dao.getAllRecordsFlow()
                  .stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())

              fun authenticate(username: String, password: String): Boolean {
                  val valid = username.trim() == "ampenan" && password == "sewatama"
                  _isAuthenticated.value = valid
                  return valid
              }

              fun saveMasterDayZero(flowMeterBbm: Double, kwhBlok1: Double, kwhBlok2: Double) {
                  masterPrefs.saveMasterDayZero(flowMeterBbm, kwhBlok1, kwhBlok2)
                  _masterConfig.value = masterPrefs.getMasterDayZero()
              }

              fun getBaselineYesterday(records: List<DailySfcEntity>, master: MasterDayZeroConfig): Triple<Double, Double, Double> {
                  val latest = records.firstOrNull()
                  return if (latest != null) {
                      Triple(latest.kwhBlok1Today, latest.kwhBlok2Today, latest.flowMeterBbmToday)
                  } else {
                      Triple(master.initialKwhBlok1, master.initialKwhBlok2, master.initialFlowMeterBbm)
                  }
              }

              fun submitDailyRecord(
                  date: String,
                  time: String,
                  operatorName: String,
                  kwhBlok1Today: Double,
                  kwhBlok2Today: Double,
                  isTankTopUpFull: Boolean,
                  tank1ActualInput: Double,
                  tank2ActualInput: Double,
                  constraintNotes: String,
                  flowMeterToday: Double,
                  onSuccess: () -> Unit,
                  onError: (String) -> Unit
              ) {
                  viewModelScope.launch {
                      try {
                          val (prevKwh1, prevKwh2, prevFlow) = getBaselineYesterday(allRecords.value, _masterConfig.value)
                          val tank1Actual = if (isTankTopUpFull) 14000.0 else tank1ActualInput
                          val tank2Actual = if (isTankTopUpFull) 14000.0 else tank2ActualInput
                          val calcResult = SfcCalculationEngine.calculateDailySfc(
                              kwhBlok1Today, prevKwh1, kwhBlok2Today, prevKwh2,
                              isTankTopUpFull, tank1Actual, tank2Actual, flowMeterToday, prevFlow
                          )
                          val entity = DailySfcEntity(
                              recordDate = date,
                              recordTime = time,
                              operatorName = operatorName,
                              prevKwhBlok1 = prevKwh1,
                              prevKwhBlok2 = prevKwh2,
                              prevFlowMeterBbm = prevFlow,
                              kwhBlok1Today = kwhBlok1Today,
                              kwhBlok2Today = kwhBlok2Today,
                              isTankTopUpFull = isTankTopUpFull,
                              tank1LevelActual = tank1Actual,
                              tank2LevelActual = tank2Actual,
                              constraintNotes = if (isTankTopUpFull) "" else constraintNotes,
                              flowMeterBbmToday = flowMeterToday,
                              totalKwh = calcResult.totalKwh,
                              totalBbmLiter = calcResult.totalBbmLiter,
                              sfcValue = calcResult.sfcValue,
                              sfcFormatted = calcResult.sfcFormatted
                          )
                          dao.insertRecord(entity)
                          onSuccess()
                      } catch (e: Exception) {
                          onError(e.message ?: "Gagal menyimpan data operasional.")
                      }
                  }
              }

              fun calculateRunningMonthAverage(records: List<DailySfcEntity>): Double {
                  if (records.isEmpty()) return 0.0
                  val latestDate = records.maxOf { it.recordDate }
                  val yearMonth = latestDate.take(7)
                  val monthRecords = records.filter { it.recordDate.startsWith(yearMonth) && it.recordDate <= latestDate }
                  if (monthRecords.isEmpty()) return 0.0
                  val sum = monthRecords.fold(BigDecimal.ZERO) { acc, item -> acc.add(BigDecimal.valueOf(item.sfcValue)) }
                  return sum.divide(BigDecimal.valueOf(monthRecords.size.toLong()), 4, RoundingMode.HALF_UP).toDouble()
              }
          }
          EOF

          # 10. CsvExportHelper.kt
          cat << 'EOF' > app/src/main/java/com/sewatama/ampenansfc/util/CsvExportHelper.kt
          package com.sewatama.ampenansfc.util

          import android.content.Context
          import android.content.Intent
          import androidx.core.content.FileProvider
          import com.sewatama.ampenansfc.data.DailySfcEntity
          import com.sewatama.ampenansfc.domain.SfcCalculationEngine
          import java.io.File

          object CsvExportHelper {
              fun exportAndShareCsv(context: Context, records: List<DailySfcEntity>, startDate: String, endDate: String) {
                  val csvHeader = "Tanggal,Jam,Nama Operator,kWh Blok 1 Kemarin,kWh Blok 1 Hari Ini,kWh Blok 2 Kemarin,kWh Blok 2 Hari Ini,Total Produksi Listrik (kWh),Top-Up Tangki Penuh (14000L),Level Tangki 1 Aktual (L),Level Tangki 2 Aktual (L),Flow Meter Kemarin (L),Flow Meter Hari Ini (L),Total Pemakaian BBM (Liter),SFC (L/kWh),Tier SFC,Warna Indikator,Indikasi Operasional,Keterangan Kendala"
                  val csvBody = records.joinToString("\n") { r ->
                      val tier = SfcCalculationEngine.evaluateTier(r.sfcValue)
                      listOf(
                          r.recordDate, r.recordTime, "\"" + r.operatorName + "\"",
                          r.prevKwhBlok1, r.kwhBlok1Today, r.prevKwhBlok2, r.kwhBlok2Today, r.totalKwh,
                          if (r.isTankTopUpFull) "YA" else "TIDAK",
                          r.tank1LevelActual, r.tank2LevelActual, r.prevFlowMeterBbm, r.flowMeterBbmToday,
                          r.totalBbmLiter, r.sfcFormatted, "Tier " + tier.tierNumber, tier.colorName,
                          "\"" + tier.indication + "\"", "\"" + r.constraintNotes.replace("\"", "'") + "\""
                      ).joinToString(",")
                  }
                  val fileName = "Laporan_SFC_Ampenan_" + startDate + "_sd_" + endDate + ".csv"
                  val exportDir = File(context.cacheDir, "exports").apply { mkdirs() }
                  val file = File(exportDir, fileName)
                  file.writeText(csvHeader + "\n" + csvBody)
                  val uri = FileProvider.getUriForFile(context, context.packageName + ".fileprovider", file)
                  val shareIntent = Intent(Intent.ACTION_SEND).apply {
                      type = "text/csv"
                      putExtra(Intent.EXTRA_SUBJECT, "Laporan SFC PLTD Sewatama Ampenan")
                      putExtra(Intent.EXTRA_STREAM, uri)
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  }
                  context.startActivity(Intent.createChooser(shareIntent, "Bagikan Laporan CSV"))
              }
          }
          EOF

          # 11. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/sewatama/ampenansfc/MainActivity.kt
          package com.sewatama.ampenansfc

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.viewModels
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.sewatama.ampenansfc.data.DailySfcEntity
          import com.sewatama.ampenansfc.domain.SfcCalculationEngine
          import com.sewatama.ampenansfc.ui.SfcViewModel
          import com.sewatama.ampenansfc.util.CsvExportHelper
          import java.time.LocalDate
          import java.time.LocalTime
          import java.time.format.DateTimeFormatter

          class MainActivity : ComponentActivity() {
              private val viewModel: SfcViewModel by viewModels()
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(
                          colorScheme = darkColorScheme(
                              primary = Color(0xFFF59E0B),
                              background = Color(0xFF090D16),
                              surface = Color(0xFF111827)
                          )
                      ) {
                          Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                              SewatamaAmpenanApp(viewModel = viewModel)
                          }
                      }
                  }
              }
          }

          enum class AppScreen(val title: String) {
              LOGIN("Login"),
              MASTER_HARI_0("Master Hari-0"),
              FORM_UTAMA("Input Jam 10:00"),
              LAPORAN("Laporan & CSV")
          }

          @Composable
          fun SewatamaAmpenanApp(viewModel: SfcViewModel) {
              val isAuthenticated by viewModel.isAuthenticated.collectAsState()
              val masterConfig by viewModel.masterConfig.collectAsState()
              val allRecords by viewModel.allRecords.collectAsState()
              var currentScreen by remember { mutableStateOf(AppScreen.LOGIN) }

              LaunchedEffect(isAuthenticated) {
                  if (isAuthenticated) {
                      currentScreen = if (!masterConfig.isConfigured && allRecords.isEmpty()) AppScreen.MASTER_HARI_0 else AppScreen.FORM_UTAMA
                  } else {
                      currentScreen = AppScreen.LOGIN
                  }
              }

              Scaffold(
                  bottomBar = {
                      if (isAuthenticated) {
                          NavigationBar(containerColor = Color(0xFF111827)) {
                              listOf(AppScreen.FORM_UTAMA, AppScreen.MASTER_HARI_0, AppScreen.LAPORAN).forEach { screen ->
                                  NavigationBarItem(
                                      selected = currentScreen == screen,
                                      onClick = { currentScreen = screen },
                                      label = { Text(screen.title) },
                                      icon = {}
                                  )
                              }
                          }
                      }
                  }
              ) { innerPadding ->
                  Box(modifier = Modifier.padding(innerPadding)) {
                      when (currentScreen) {
                          AppScreen.LOGIN -> LoginScreen { u, p -> viewModel.authenticate(u, p) }
                          AppScreen.MASTER_HARI_0 -> MasterDayZeroScreen(
                              masterConfig.initialFlowMeterBbm,
                              masterConfig.initialKwhBlok1,
                              masterConfig.initialKwhBlok2
                          ) { f, k1, k2 ->
                              viewModel.saveMasterDayZero(f, k1, k2)
                              currentScreen = AppScreen.FORM_UTAMA
                          }
                          AppScreen.FORM_UTAMA -> MainOperationalFormScreen(viewModel, allRecords) {
                              currentScreen = AppScreen.LAPORAN
                          }
                          AppScreen.LAPORAN -> ReportAndExportScreen(viewModel, allRecords)
                      }
                  }
              }
          }

          @Composable
          fun LoginScreen(onLoginSuccess: (String, String) -> Boolean) {
              var username by remember { mutableStateOf("") }
              var password by remember { mutableStateOf("") }
              var errorMsg by remember { mutableStateOf<String?>(null) }
              Column(
                  modifier = Modifier.fillMaxSize().padding(24.dp),
                  verticalArrangement = Arrangement.Center,
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Text("Sewatama Ampenan SFC", fontSize = 24.sp, fontWeight = FontWeight.Bold, color = Color.White)
                  Text("PT Sumberdaya Sewatama - PLTD Ampenan", fontSize = 14.sp, color = Color.Gray, modifier = Modifier.padding(bottom = 24.dp))
                  OutlinedTextField(value = username, onValueChange = { username = it; errorMsg = null }, label = { Text("Username") }, singleLine = true, modifier = Modifier.fillMaxWidth())
                  Spacer(modifier = Modifier.height(12.dp))
                  OutlinedTextField(value = password, onValueChange = { password = it; errorMsg = null }, label = { Text("Password") }, singleLine = true, visualTransformation = PasswordVisualTransformation(), modifier = Modifier.fillMaxWidth())
                  if (errorMsg != null) Text(errorMsg!!, color = Color(0xFFEF4444), fontSize = 13.sp, modifier = Modifier.padding(top = 8.dp))
                  Spacer(modifier = Modifier.height(20.dp))
                  Button(onClick = { if (!onLoginSuccess(username, password)) errorMsg = "Gunakan Super User: ampenan / sewatama" }, modifier = Modifier.fillMaxWidth().height(50.dp)) {
                      Text("Login", fontWeight = FontWeight.SemiBold)
                  }
              }
          }

          @Composable
          fun MasterDayZeroScreen(initialFlow: Double, initialKwh1: Double, initialKwh2: Double, onSave: (Double, Double, Double) -> Unit) {
              var flowText by remember(initialFlow) { mutableStateOf(initialFlow.toBigDecimal().toPlainString()) }
              var kwh1Text by remember(initialKwh1) { mutableStateOf(initialKwh1.toBigDecimal().toPlainString()) }
              var kwh2Text by remember(initialKwh2) { mutableStateOf(initialKwh2.toBigDecimal().toPlainString()) }
              Column(modifier = Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(20.dp)) {
                  Text("Pengaturan Master Hari-0", fontSize = 20.sp, fontWeight = FontWeight.Bold)
                  Spacer(modifier = Modifier.height(16.dp))
                  OutlinedTextField(value = flowText, onValueChange = { flowText = it }, label = { Text("Initial Flow Meter BBM (Liter)") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal), modifier = Modifier.fillMaxWidth())
                  Spacer(modifier = Modifier.height(12.dp))
                  OutlinedTextField(value = kwh1Text, onValueChange = { kwh1Text = it }, label = { Text("Initial kWh Blok 1 (kWh)") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal), modifier = Modifier.fillMaxWidth())
                  Spacer(modifier = Modifier.height(12.dp))
                  OutlinedTextField(value = kwh2Text, onValueChange = { kwh2Text = it }, label = { Text("Initial kWh Blok 2 (kWh)") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal), modifier = Modifier.fillMaxWidth())
                  Spacer(modifier = Modifier.height(24.dp))
                  Button(onClick = { onSave(flowText.toDoubleOrNull() ?: 0.0, kwh1Text.toDoubleOrNull() ?: 0.0, kwh2Text.toDoubleOrNull() ?: 0.0) }, modifier = Modifier.fillMaxWidth().height(50.dp)) {
                      Text("Simpan Data Master Hari-0")
                  }
              }
          }

          @Composable
          fun MainOperationalFormScreen(viewModel: SfcViewModel, records: List<DailySfcEntity>, onSaved: () -> Unit) {
              val master by viewModel.masterConfig.collectAsState()
              val (prevKwh1, prevKwh2, prevFlow) = viewModel.getBaselineYesterday(records, master)
              val currentDate = remember { LocalDate.now().format(DateTimeFormatter.ISO_LOCAL_DATE) }
              val currentTime = remember { LocalTime.now().format(DateTimeFormatter.ofPattern("HH:mm")) }
              var operatorName by remember { mutableStateOf("") }
              var kwh1Today by remember { mutableStateOf("") }
              var kwh2Today by remember { mutableStateOf("") }
              var isTopUpFull by remember { mutableStateOf(true) }
              var tank1Actual by remember { mutableStateOf("14000") }
              var tank2Actual by remember { mutableStateOf("14000") }
              var constraintNotes by remember { mutableStateOf("") }
              var flowMeterToday by remember { mutableStateOf("") }
              var errorBanner by remember { mutableStateOf<String?>(null) }

              Column(modifier = Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp)) {
                  DashboardSummarySection(viewModel, records)
                  Spacer(modifier = Modifier.height(16.dp))
                  Text("Form Pencatatan Harian (Jam 10:00)", fontSize = 18.sp, fontWeight = FontWeight.Bold)
                  Spacer(modifier = Modifier.height(8.dp))
                  OutlinedTextField(value = currentDate + " | " + currentTime + " WITA", onValueChange = {}, readOnly = true, label = { Text("Tanggal & Waktu Sistem") }, modifier = Modifier.fillMaxWidth())
                  Spacer(modifier = Modifier.height(8.dp))
                  OutlinedTextField(value = operatorName, onValueChange = { operatorName = it }, label = { Text("Nama Operator") }, modifier = Modifier.fillMaxWidth())
                  Spacer(modifier = Modifier.height(8.dp))
                  OutlinedTextField(value = kwh1Today, onValueChange = { kwh1Today = it }, label = { Text("kWh Blok 1 Hari Ini (Kemarin: " + prevKwh1 + ")") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal), modifier = Modifier.fillMaxWidth())
                  Spacer(modifier = Modifier.height(8.dp))
                  OutlinedTextField(value = kwh2Today, onValueChange = { kwh2Today = it }, label = { Text("kWh Blok 2 Hari Ini (Kemarin: " + prevKwh2 + ")") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal), modifier = Modifier.fillMaxWidth())
                  Spacer(modifier = Modifier.height(12.dp))
                  Text("Apakah Tangki 1 & 2 sudah di-top up penuh (14.000 L)?")
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      RadioButton(selected = isTopUpFull, onClick = { isTopUpFull = true; tank1Actual = "14000"; tank2Actual = "14000" })
                      Text("YA (14.000 L)")
                      Spacer(modifier = Modifier.width(16.dp))
                      RadioButton(selected = !isTopUpFull, onClick = { isTopUpFull = false })
                      Text("TIDAK")
                  }
                  OutlinedTextField(value = if (isTopUpFull) "14000" else tank1Actual, onValueChange = { if (!isTopUpFull) tank1Actual = it }, readOnly = isTopUpFull, label = { Text("Level Tangki 1 Aktual (L)") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal), modifier = Modifier.fillMaxWidth())
                  Spacer(modifier = Modifier.height(8.dp))
                  OutlinedTextField(value = if (isTopUpFull) "14000" else tank2Actual, onValueChange = { if (!isTopUpFull) tank2Actual = it }, readOnly = isTopUpFull, label = { Text("Level Tangki 2 Aktual (L)") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal), modifier = Modifier.fillMaxWidth())
                  if (!isTopUpFull) {
                      Spacer(modifier = Modifier.height(8.dp))
                      OutlinedTextField(value = constraintNotes, onValueChange = { constraintNotes = it }, label = { Text("Keterangan Kendala") }, modifier = Modifier.fillMaxWidth())
                  }
                  Spacer(modifier = Modifier.height(8.dp))
                  OutlinedTextField(value = flowMeterToday, onValueChange = { flowMeterToday = it }, label = { Text("Flow Meter BBM Hari Ini (Kemarin: " + prevFlow + ")") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal), modifier = Modifier.fillMaxWidth())
                  if (errorBanner != null) Text(errorBanner!!, color = Color(0xFFEF4444), modifier = Modifier.padding(top = 8.dp))
                  Spacer(modifier = Modifier.height(16.dp))
                  Button(onClick = {
                      viewModel.submitDailyRecord(
                          currentDate, currentTime, operatorName.ifBlank { "Operator Shift" },
                          kwh1Today.toDoubleOrNull() ?: 0.0, kwh2Today.toDoubleOrNull() ?: 0.0,
                          isTopUpFull, tank1Actual.toDoubleOrNull() ?: 14000.0, tank2Actual.toDoubleOrNull() ?: 14000.0,
                          constraintNotes, flowMeterToday.toDoubleOrNull() ?: 0.0, onSaved, { errorBanner = it }
                      )
                  }, modifier = Modifier.fillMaxWidth().height(52.dp)) {
                      Text("Hitung & Simpan Pencatatan Jam 10:00", fontWeight = FontWeight.Bold)
                  }
              }
          }

          @Composable
          fun DashboardSummarySection(viewModel: SfcViewModel, records: List<DailySfcEntity>) {
              val latest = records.firstOrNull()
              val avgSfc = viewModel.calculateRunningMonthAverage(records)
              val latestTier = SfcCalculationEngine.evaluateTier(latest?.sfcValue ?: 0.2815)
              val avgTier = SfcCalculationEngine.evaluateTier(avgSfc)
              Column(modifier = Modifier.fillMaxWidth().background(Color(0xFF111827), RoundedCornerShape(12.dp)).border(1.dp, Color(0xFF1E293B), RoundedCornerShape(12.dp)).padding(16.dp)) {
                  Text("RINGKASAN OPERASIONAL HARI INI", fontSize = 12.sp, color = Color.Gray)
                  Spacer(modifier = Modifier.height(8.dp))
                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                      Column {
                          Text("Total kWh Hari Ini", fontSize = 12.sp, color = Color.Gray)
                          Text((latest?.totalKwh ?: 0.0).toString() + " kWh", fontWeight = FontWeight.Bold, fontFamily = FontFamily.Monospace)
                      }
                      Column {
                          Text("Total BBM Hari Ini", fontSize = 12.sp, color = Color.Gray)
                          Text((latest?.totalBbmLiter ?: 0.0).toString() + " L", fontWeight = FontWeight.Bold, fontFamily = FontFamily.Monospace)
                      }
                  }
                  Spacer(modifier = Modifier.height(12.dp))
                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                      Column {
                          Text("SFC Hari Ini", fontSize = 12.sp, color = Color.Gray)
                          Text(latest?.sfcFormatted ?: "0.0000", color = latestTier.textColor, fontWeight = FontWeight.Bold, fontSize = 20.sp, fontFamily = FontFamily.Monospace)
                          Text("Tier " + latestTier.tierNumber + ": " + latestTier.indication, fontSize = 11.sp, color = latestTier.textColor)
                      }
                      Column(horizontalAlignment = Alignment.End) {
                          Text("Rata-rata SFC Bulan Ini", fontSize = 12.sp, color = Color.Gray)
                          Text(SfcCalculationEngine.formatFourDecimals(avgSfc), color = avgTier.textColor, fontWeight = FontWeight.Bold, fontSize = 20.sp, fontFamily = FontFamily.Monospace)
                          Text("Tier " + avgTier.tierNumber + ": " + avgTier.indication, fontSize = 11.sp, color = avgTier.textColor)
                      }
                  }
              }
          }

          @Composable
          fun ReportAndExportScreen(viewModel: SfcViewModel, records: List<DailySfcEntity>) {
              val context = LocalContext.current
              var startDate by remember { mutableStateOf("2026-09-01") }
              var endDate by remember { mutableStateOf("2026-09-30") }
              val filtered = remember(records, startDate, endDate) { records.filter { it.recordDate in startDate..endDate }.sortedBy { it.recordDate } }
              Column(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  Text("Laporan & Ekspor Data CSV", fontSize = 18.sp, fontWeight = FontWeight.Bold)
                  Spacer(modifier = Modifier.height(8.dp))
                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      OutlinedTextField(value = startDate, onValueChange = { startDate = it }, label = { Text("Start Date") }, modifier = Modifier.weight(1f))
                      OutlinedTextField(value = endDate, onValueChange = { endDate = it }, label = { Text("End Date") }, modifier = Modifier.weight(1f))
                  }
                  Spacer(modifier = Modifier.height(8.dp))
                  Button(onClick = { CsvExportHelper.exportAndShareCsv(context, filtered, startDate, endDate) }, modifier = Modifier.fillMaxWidth()) {
                      Text("Export to CSV & Share (WhatsApp / Email)")
                  }
                  Spacer(modifier = Modifier.height(12.dp))
                  LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      items(filtered) { row ->
                          val tier = SfcCalculationEngine.evaluateTier(row.sfcValue)
                          Row(modifier = Modifier.fillMaxWidth().background(Color(0xFF111827), RoundedCornerShape(8.dp)).padding(12.dp), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                              Column {
                                  Text(row.recordDate + " (" + row.recordTime + ") - " + row.operatorName, fontWeight = FontWeight.SemiBold, fontSize = 13.sp)
                                  Text("Produksi: " + row.totalKwh + " kWh | BBM: " + row.totalBbmLiter + " L", fontSize = 12.sp, color = Color.Gray)
                              }
                              Column(horizontalAlignment = Alignment.End) {
                                  Text(row.sfcFormatted, color = tier.textColor, fontWeight = FontWeight.Bold, fontSize = 16.sp, fontFamily = FontFamily.Monospace)
                                  Text("Tier " + tier.tierNumber + " (" + tier.colorName + ")", fontSize = 11.sp, color = tier.textColor)
                              }
                          }
                      }
                  }
              }
          }
          EOF

          echo "Struktur proyek Android :app berhasil diverifikasi dan siap di-build."

      - name: 3. Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 4. Setup Android SDK Licenses
        shell: bash
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 5. Setup Gradle 8.10.2 (Modern & Bebas Warning Deprecated)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: 6. Build Debug APK (:app:assembleDebug)
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 7. Siapkan Nama File APK Siap Instal
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Sewatama-Ampenan-SFC.apk

      - name: 8. Upload File APK Siap Instal
        uses: actions/upload-artifact@v4
        with:
          name: Sewatama-Ampenan-SFC-Installer-APK
          path: |
            Sewatama-Ampenan-SFC.apk
            app/build/outputs/apk/debug/*.apk
